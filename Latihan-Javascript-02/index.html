<!DOCTYPE html>
<html>
    <head>
    <title>Latihan Javascript 02</title>
    </head>
<body>

<h2>To-Do List</h2>

<form action="/action_page.php" onsubmit="return false;">
  <input type="text" id="fname" name="fname" placeholder="Tulis tugas..">
  <button type="button" onclick="myFunction()">Tambah</button>
</form> 

<ul id="todo-list"></ul>

</body>
<script>
    function myFunction() {
        const input = document.getElementById('fname');
        const text = (input.value || '').trim();
        if (!text) {
            return;
        }
        const ul = document.getElementById('todo-list');
        const li = document.createElement('li');
        li.textContent = text;
        li.addEventListener('click', () => ul.removeChild(li));
        ul.appendChild(li);
        input.value = '';
        input.focus();
    }
</script>
</html>
