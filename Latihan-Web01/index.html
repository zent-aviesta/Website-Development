<!DOCTYPE html>
<html lang="en">
<head>
<title>Latihan Web01</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
}

/* Style the header */
header {
  background-color: #ffe6cc;
  padding: 10px;
  text-align: center;
}

/* Create two columns/boxes that floats next to each other */
nav {
  float: left;
  width: 70%;
  height: 300px; /* only for demonstration, should be removed */
  background: #f8cecc;
  padding: 20px;
}

/* Style the list inside the menu */
nav ul {
  list-style-type: none;
  padding: 0;
}

article {
  float: left;
  padding: 20px;
  width: 30%;
  background-color: #d5e8d4;
  height: 300px; /* only for demonstration, should be removed */
}

/* Clear floats after the columns */
section::after {
  content: "";
  display: table;
  clear: both;
}

/* Style the footer */
footer {
  background-color: #ffe6cc;
  padding: 10px;
  text-align: center;
}

/* Responsive layout - makes the two columns/boxes stack on top of each other instead of next to each other, on small screens */
@media (max-width: 600px) {
  nav, article {
    width: 100%;
    height: auto;
  }
}
</style>
</head>
<body>

<header>
  <p>HEADER</p>
</header>
<header style="background-color: #dae8fc; padding: 25px;">NAVIGASI</header>
<section>
  <nav>
    <h1>HEADING 1</h1>
    <p>lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aquila.</p>
  </nav>
  
  <article>
    <h4>Menu:</h4>
    <ul>
      <li>Home</li>
      <li>Berita</li>
      <li>Layanan</li>
      <li>Kontak</li>
    </ul>
  </article>
</section>

<footer>
  <p>FOOTER</p>
</footer>

</body>
</html>
